<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Propriétaire - VetDeFrance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" media="screen" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .deco-animal {
            position: fixed;
            bottom: 0;
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
        }

        .deco-cat {
            left: 2vw;
            animation: decoFloat 6s ease-in-out infinite;
        }

        .deco-dog {
            right: 2vw;
            animation: decoFloat 6s ease-in-out infinite 1s;
        }

        @keyframes decoFloat {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-18px)
            }
        }
    </style>
</head>

<body>
    <a href="{{ url_for('accueil') }}" class="logout-btn" title="Retour à l'accueil">
        <i class="fas fa-arrow-left" style="font-size: 24px; color: white;"></i>
    </a>
    <svg class="deco-animal deco-cat" width="180" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="18,38 10,10 32,28" fill="white" />
        <polygon points="82,38 90,10 68,28" fill="white" />
        <ellipse cx="50" cy="50" rx="32" ry="28" fill="white" />
        <ellipse cx="38" cy="46" rx="5" ry="6" fill="#1f2937" />
        <ellipse cx="62" cy="46" rx="5" ry="6" fill="#1f2937" />
        <circle cx="40" cy="44" r="1.5" fill="white" />
        <circle cx="64" cy="44" r="1.5" fill="white" />
        <ellipse cx="50" cy="56" rx="3" ry="2" fill="#f87171" />
        <line x1="20" y1="54" x2="44" y2="57" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" />
        <line x1="20" y1="59" x2="44" y2="59" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" />
        <line x1="56" y1="57" x2="80" y2="54" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" />
        <line x1="56" y1="59" x2="80" y2="59" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" />
        <ellipse cx="50" cy="95" rx="26" ry="22" fill="white" />
        <path d="M76 105 Q95 80 88 65" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" />
        <ellipse cx="34" cy="115" rx="9" ry="6" fill="white" />
        <ellipse cx="66" cy="115" rx="9" ry="6" fill="white" />
    </svg>
    <svg class="deco-animal deco-dog" width="180" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="24" cy="42" rx="12" ry="20" fill="white" transform="rotate(-15 24 42)" />
        <ellipse cx="76" cy="42" rx="12" ry="20" fill="white" transform="rotate(15 76 42)" />
        <ellipse cx="50" cy="46" rx="28" ry="26" fill="white" />
        <ellipse cx="39" cy="42" rx="5" ry="5.5" fill="#1f2937" />
        <ellipse cx="61" cy="42" rx="5" ry="5.5" fill="#1f2937" />
        <circle cx="41" cy="40" r="1.5" fill="white" />
        <circle cx="63" cy="40" r="1.5" fill="white" />
        <ellipse cx="50" cy="56" rx="13" ry="9" fill="#f3f4f6" />
        <ellipse cx="50" cy="52" rx="4" ry="3" fill="#1f2937" />
        <ellipse cx="50" cy="94" rx="28" ry="23" fill="white" />
        <path d="M78 90 Q100 70 92 55" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" />
        <ellipse cx="33" cy="114" rx="10" ry="6" fill="white" />
        <ellipse cx="67" cy="114" rx="10" ry="6" fill="white" />
    </svg>
    <div id="container">
        <form method="POST" class="a">
            <div style="text-align: center; margin-bottom: 20px;">
                <div class="icon-wrapper primary" style="margin: 0 auto;">
                    <i class="fas fa-paw"></i>
                </div>
            </div>

            <h1 style="margin-bottom: 12px;">Espace Propriétaire</h1>
            <p style="text-align: center; color: var(--text-light); margin-bottom: 32px;">
                Accédez au dossier médical de votre compagnon
            </p>

            {% if erreur %}
            <div class="error-message">
                <i class="fas fa-exclamation-triangle" style="font-size: 1.2rem;"></i>
                <span>{{ erreur }}</span>
            </div>
            {% endif %}

            <div>
                <label for="numero">
                    <i class="fas fa-phone" style="margin-right: 8px;"></i> <b>Numéro de téléphone</b>
                </label>
                <input type="tel" id="numero" placeholder="0656666955" name="numero" pattern="[0-9]{10}" required
                    autofocus>

                <label for="username">
                    <i class="fas fa-envelope" style="margin-right: 8px;"></i> <b>Adresse email</b>
                </label>
                <input type="email" id="username" placeholder="votreemail@exemple.fr" name="username" required>

                <label for="id_animal">
                    <i class="fas fa-tag" style="margin-right: 8px;"></i> <b>Numéro de suivi de votre animal</b>
                </label>
                <input type="text" id="id_animal" placeholder="00001" name="id_animal" maxlength="5" required>
            </div>

            <button type="submit" id="submit">
                Accéder à mon espace <i class="fas fa-rocket" style="margin-left: 8px;"></i>
            </button>

            <div class="divider"></div>

            <p style="font-size: 0.95rem;">
                Pas encore de compte ? <a href="{{ url_for('creer_proprietaire') }}" style="font-weight: 700; color: var(--primary-color);">
                    Créer mon compte propriétaire <i class="fas fa-user-plus"></i>
                </a>
            </p>
            <p style="font-size: 0.9rem; margin-top: 12px;">
                <a href="{{ url_for('inv') }}">Découvrir nos centres <i class="fas fa-hospital"></i></a>
            </p>
            <p style="font-size: 0.9rem; margin-top: 12px;">
                <a href="{{ url_for('accueil') }}" style="color: var(--text-light);">← Retour à l'accueil</a>
            </p>
        </form>
    </div>
</body>

</html>
